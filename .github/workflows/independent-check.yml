name: Independent Pingouin check
on:
  workflow_dispatch:
  push:
    paths:
      - IndependentCheck.ps1
      - pingouin/DEPENDENCIES.lock.txt
      - pingouin/BUILD.lock.txt
      - .github/workflows/independent-check.yml
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install the recorded dependency installer
        run: python -m pip install uv==0.12.24
      - name: Clone upstream and calculate without the original harness
        shell: pwsh
        run: ./IndependentCheck.ps1 -Scratch (Join-Path $env:RUNNER_TEMP 'pingouin-independent-check')
      - name: Preserve the raw result even if the comparison fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-scientific-csv
          path: ${{ runner.temp }}/pingouin-independent-check/independent-analysis.csv
          if-no-files-found: warn
