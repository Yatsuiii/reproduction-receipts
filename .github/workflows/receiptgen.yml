name: Receipt generator tests
on:
  pull_request:
    paths: ['receiptgen/**', 'scripts/hooks/**', '.github/workflows/receiptgen.yml']
  push:
    branches: [main]
    paths: ['receiptgen/**', 'scripts/hooks/**', '.github/workflows/receiptgen.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04            # setup-python has no 3.12.10 build for Ubuntu 26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Frozen injections and entry points unchanged
        run: python receiptgen/check_frozen.py
      - name: Tests (stdlib only, builds local git repos)
        run: python -m unittest discover -s receiptgen/tests -v
