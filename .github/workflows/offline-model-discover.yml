name: Offline model, discover pin and lock
# One-off: reads the model repository and resolves the dependency lock so both can be committed and frozen
# before any scored run. Its first run printed the MODEL.json pin; this version only resolves the lock and commits it.
on:
  pull_request:
    paths: ['offline-model/fetch_weights.py', 'offline-model/requirements.in', '.github/workflows/offline-model-discover.yml']
permissions:
  contents: write   # the lock job commits requirements.lock back to this PR branch
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install uv and huggingface-hub
        run: python -m pip install uv==0.13.7 huggingface-hub==2.3.0
      - name: Resolve dependency lock with hashes
        run: |
          uv pip compile offline-model/requirements.in --generate-hashes --python-version 3.12 \
            --python-platform x86_64-manylinux_2_28 --exclude-newer 2026-11-14T00:00:00Z \
            --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match \
            -o offline-model/requirements.lock
          sha256sum offline-model/requirements.lock
      - name: Commit the lock to the PR branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add offline-model/requirements.lock
          git diff --cached --quiet || git commit -m "offline-model: dependency lock resolved by the discover job (run ${{ github.run_id }})"
          git push origin HEAD:${{ github.head_ref }}
